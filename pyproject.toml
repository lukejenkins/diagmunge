[project]
name = "diagmunge"
version = "0.1.0"
description = "Shared Qualcomm DIAG transport core (+ format-munge tools)"
license = "Apache-2.0"
requires-python = ">=3.11"
# Core transport (TCP / UDP / raw-fd) is stdlib-only — mirrors diaggrok.
dependencies = []

[project.optional-dependencies]
# The serial transport (DiagClient.from_serial) imports pyserial lazily.
serial = ["pyserial"]
# The libusb transport (DiagClient.from_libusb) imports pyusb lazily —
# for raw-USB-only DIAG modems (Inseego M3100 SDX65, Foxconn/T99W MHI variants)
# that expose no ttyUSB/cdc-wdm node. Core stays stdlib-only when pyusb absent.
libusb = ["pyusb"]
# The decode helper (DiagClient.observe_codes) imports diaggrok.frame lazily.
# Inward-only dependency edge: diagmunge -> diaggrok, never the reverse.
# diaggrok is not on PyPI (yet) — resolve via a PEP 508 direct git+https URL
# until it is published there, then revert these to the bare name. Direct-URL
# deps also mean this package itself cannot be uploaded to PyPI as-is; that is
# fine while both install straight from GitHub. Pinned to a diaggrok release
# tag this package's suite was verified against; bump it with each re-verify.
decode = ["diaggrok @ git+https://github.com/lukejenkins/diaggrok@v2026.10.12"]
# The munge CLI tools decode HDLC/DLF via diaggrok (hard functional dep, imported
# at module top level — but only when a munge tool is invoked, so bare
# `import diagmunge` stays diaggrok-free).
munge = ["diaggrok @ git+https://github.com/lukejenkins/diaggrok@v2026.10.12"]

[project.scripts]
diagmunge-hdlc-to-dlf = "diagmunge.munge.hdlc_to_dlf:main"
diagmunge-capture-dlf = "diagmunge.munge.capture_dlf_from_diag:main"
diagmunge-dlf-to-pcap = "diagmunge.munge.dlf_to_pcap:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Measured QSH-trace masksets: NO WARRANTY (data/QSH_MASKSET_MEASURED.md).
[tool.setuptools.package-data]
diagmunge = ["data/*.json", "data/*.md"]
